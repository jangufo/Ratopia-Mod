name: Build RatopiaMod.Nyaiko.YunQing

on:
  workflow_dispatch:
  push:
    tags:
      - "yunqing-v*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and package YunQing.All
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Game assemblies are not committed to this repository. Store the zip produced by
      # scripts/package-ci-dependencies.ps1 in a PRIVATE repository release, then configure:
      #   RATOPIA_DEPS_REPO  = owner/private-dependency-repo
      #   RATOPIA_DEPS_TOKEN = fine-grained PAT with Contents: Read-only for that repository
      # The release tag defaults to deps-v1 and can be overridden with repository variable
      # RATOPIA_DEPS_TAG.
      - name: Download private Ratopia reference assemblies
        env:
          GH_TOKEN: ${{ secrets.RATOPIA_DEPS_TOKEN }}
          DEPS_REPO: ${{ secrets.RATOPIA_DEPS_REPO }}
          DEPS_TAG: ${{ vars.RATOPIA_DEPS_TAG || 'deps-v1' }}
        shell: bash
        run: |
          : "${DEPS_REPO:?Set the RATOPIA_DEPS_REPO repository secret}"
          : "${GH_TOKEN:?Set the RATOPIA_DEPS_TOKEN repository secret}"
          mkdir -p "$RUNNER_TEMP/ratopia"
          gh release download "$DEPS_TAG" \
            --repo "$DEPS_REPO" \
            --pattern "ratopia-ci-deps.zip" \
            --output "$RUNNER_TEMP/ratopia-ci-deps.zip"
          unzip -q "$RUNNER_TEMP/ratopia-ci-deps.zip" -d "$RUNNER_TEMP/ratopia"
          echo "RATOPIA_DIR=$RUNNER_TEMP/ratopia" >> "$GITHUB_ENV"

      - name: Build Release
        run: >-
          dotnet build RatopiaMod.Nyaiko.YunQing/RatopiaMod.YunQing.All/RatopiaMod.YunQing.All.csproj
          -c Release
          -p:DisableRatopiaModInstall=true

      - name: Package plugin
        shell: pwsh
        run: |
          $errorActionPreference = 'Stop'
          $projectPath = 'RatopiaMod.Nyaiko.YunQing/RatopiaMod.YunQing.All/RatopiaMod.YunQing.All.csproj'
          [xml] $project = Get-Content $projectPath
          $version = $project.Project.PropertyGroup.Version
          if (-not $version) { throw "Cannot read <Version> from $projectPath" }

          $outputDir = 'RatopiaMod.Nyaiko.YunQing/RatopiaMod.YunQing.All/bin/Release'
          $packageDir = 'artifacts/package/BepInEx/plugins/RatopiaMod.YunQing.All'
          $zipPath = "artifacts/RatopiaMod.YunQing.All-v$version.zip"
          New-Item -ItemType Directory -Force $packageDir | Out-Null
          Copy-Item "$outputDir/RatopiaMod.YunQing.All.dll" $packageDir
          Copy-Item "$outputDir/translate-kv.json" $packageDir
          Compress-Archive -Path "artifacts/package/BepInEx" -DestinationPath $zipPath -Force
          Get-Item $zipPath

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RatopiaMod.YunQing.All
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/yunqing-v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip



